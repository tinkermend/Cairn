<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Canvas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>画布</h1>
      <canvas id="board" width="200" height="80"></canvas>
    </main>
    <script>
      const ctx = document.getElementById('board').getContext('2d')
      ctx.fillStyle = '#2563eb'
      ctx.fillRect(10, 10, 80, 40)
    </script>
  </body>
</html>
