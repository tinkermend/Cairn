packages:
  - 'packages/*'
  # 浏览器扩展命名空间：每个上游插件一个子包，见 packages/extension/README.md
  - 'packages/extension/*'

allowBuilds:
  '@swc/core': true
  argon2: set this to true or false
  esbuild: true

# pnpm 默认拦截依赖的 postinstall。以下依赖需要下载/编译原生二进制，
# 均属构建与测试工具链，显式放行。
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - playwright
