packages:
  - 'packages/*'
  # 浏览器扩展命名空间：每个上游插件一个子包，见 packages/extension/README.md
  - 'packages/extension/*'

allowBuilds:
  '@swc/core': true
  argon2: false
  esbuild: true
  onnxruntime-node: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13

# pnpm 默认拦截依赖的 postinstall。以下依赖需要下载/编译原生二进制，
# 均属构建与测试工具链，显式放行。
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - playwright
  - sharp
  - onnxruntime-node
