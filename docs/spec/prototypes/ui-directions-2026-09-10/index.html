if(state.evidence==='attempts')return `<div class="evidence-log"><strong>尝试 01 / 02</strong>\n14:30:28 开始 · 页面仍在加载\n14:30:44 失败 · 页面读取超时\n\n<strong>尝试 02 / 02</strong>\n14:30:46 开始 · 页面加载完成\n14:30:58 失败 · 审批状态与预期不一致\n\n<strong>步骤最终结果</strong>\n策略允许的尝试次数已耗尽，StepRun 标记为失败。\n步骤结果已持久化，运行停止并保留证据。</div>`;
return `<div class="evidence-log"><strong>14:30:16</strong>　创建运行 · 冻结场景 v1.7\n<strong>14:30:16</strong>　复用健康会话 · 取得独占使用权\n<strong>14:30:17</strong>　步骤 01 完成 · 打开页面\n<strong>14:30:19</strong>　步骤 02 完成 · 进入订单列表\n<strong>14:30:27</strong>　步骤 03 完成 · 定位订单\n<strong>14:30:44</strong>　步骤 04 第一次尝试超时\n<strong>14:30:46</strong>　开始第二次尝试\n<strong>14:30:58</strong>　AI Assert 未通过 · 保存输出与截图\n<strong>14:30:58</strong>　运行失败 · 释放使用权，会话保留</div>`;}
function run(){return `<div class="between page-head"><div><div class="row tiny muted" style="margin-bottom:7px"><button class="text-action" data-page="overview">工作台</button>${I('ChevronRight')}<span class="mono">R-0926</span></div><div class="row"><h1>采购订单状态校验</h1>${status('运行失败','danger')}</div><p>采购协同平台 · 采购巡检账号 · 手工运行</p><div class="run-summary"><span>场景快照<strong>v1.7</strong></span><span>开始时间<strong class="mono">14:30:16</strong></span><span>总耗时<strong class="mono">42 秒</strong></span><span>已完成<strong>3 / 5 步骤</strong></span></div></div><div class="actions">${button('编辑场景','Pencil','data-page="studio"')}${button('再次运行','RotateCw','data-demo="再次运行"',true)}</div></div>
<div class="view-tabs" role="group" aria-label="运行详情视图"><button class="active" aria-pressed="true">执行与证据</button><button data-demo="运行上下文" aria-pressed="false">运行上下文</button><button data-demo="冻结配置" aria-pressed="false">冻结配置</button><button data-demo="浏览器会话" aria-pressed="false">浏览器会话</button></div>
<div class="run-grid"><aside class="panel run-steps"><div class="between run-step-heading"><h2>执行步骤</h2><span class="tiny muted">3 成功 / 1 失败</span></div>${steps.map((step,i)=>`<button class="step ${i===3?'selected':''}" data-run-step="${i}" aria-pressed="${i===3}"><span class="step-number ${i<3?'done':i===3?'failed':''}">${I(i<3?'CircleCheck':i===3?'CircleX':'CircleDashed')}</span><span><strong>${step.title}</strong><p>${step.type} · ${['成功 · 1 秒','成功 · 2 秒','成功 · 8 秒','失败 · 2 次尝试','未执行'][i]}</p></span></button>`).join('')}<div class="frozen"><div class="row" style="gap:7px;margin-bottom:7px">${I('LockKeyhole')}历史运行使用冻结快照 v1.7</div>当前场景的新版本不会改变本次运行的步骤、参数和证据。</div><div class="frozen"><strong style="font-weight:550;color:var(--text)">浏览器会话 · 已复用</strong><br>采购协同平台 / 采购巡检账号<br>本次运行的使用权已释放，<br>健康会话保留供后续执行。</div></aside>
<section class="panel evidence"><div class="between panel-head"><div><h2>04 · 确认订单已完成审批</h2><p>AI Assert · 只读判断 · 视觉标准版</p></div><div class="row run-head-extra">${badge('尝试 02 / 02')}<button class="btn small" data-demo="导出证据">${I('Download')} 导出证据</button></div></div><div class="evidence-tabs" role="group" aria-label="证据内容">${[['screenshot','截图与判断'],['output','输入 / 输出'],['attempts','尝试记录 · 2'],['events','运行事件']].map(([id,label])=>`<button data-evidence="${id}" class="${state.evidence===id?'active':''}" aria-pressed="${state.evidence===id}">${label}</button>`).join('')}</div><div class="evidence-pane">${evidencePane()}</div></section></div>`;}
function render(){document.documentElement.dataset.theme=state.theme;document.querySelector('#direction-note').textContent=themes[state.theme].note;document.querySelectorAll('[data-theme-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.themeChoice===state.theme)));document.querySelector('#sidebar').innerHTML=sidebar();document.querySelector('#main').innerHTML=topbar()+`<div class="content">${{overview,studio,run}[state.page]()}${footer()}</div>`;const url=new URL(location);url.searchParams.set('theme',state.theme);url.searchParams.set('page',state.page);history.replaceState(null,'',url);}
const descriptions={
'试运行':'正式产品会创建统一的 Run，冻结当前草稿配置，并在下方展示步骤进度和证据。本原型仅演示界面，不启动浏览器或调用模型。',
'再次运行':'正式产品会基于所选版本创建一个新的 Run，保留本次历史记录与证据。本原型不会提交执行任务。',
'录制步骤':'正式产品会连接浏览器录制组件，将操作规范化为可编辑的有序步骤。录制入口与手工编排使用同一种场景定义。',
'保存草稿':'当前是本地视觉原型。步骤配置可在本次浏览中编辑、应用；这里不会写入识途的场景数据。',
'目标系统':'目标系统管理入口：查看系统入口、执行策略及其专属目标账号。目标账号与控制台成员分开管理。本轮聚焦工作台、场景编排和运行详情。',
'巡检调度':'调度页将以计划列表为主，展示绑定场景、执行周期、下一次执行和最近结果。计划触发同一种 Run。',
'浏览器会话':'会话页将展示目标系统与目标账号、健康状态、认证状态、使用中或空闲，以及有效期。运行结束后，健康会话可以继续复用。',
'冻结配置':'本次运行冻结的是场景 v1.7，以及 AI 指令、执行器版本、模型路由、实际模型、策略版本、关键参数和输出契约。编辑场景中的当前草稿基于 v1.8。',
'运行上下文':'示例输入：orderNumber = PO-20260910-028。步骤 order 输出订单信息；approval 输出 passed = false。后续步骤从具名输出读取数据。',
'更新登录态':'正式产品会在目标系统的专属账号下更新认证状态。本原型不会读取凭据或更改现有会话。',
'模型路由':'集中管理团队的模型访问与路由策略。场景保存业务意图，运行快照保留当时实际使用的模型配置。',
'成员与权限':'控制台成员与 RBAC 权限管理；与用于登录目标业务系统的目标账号保持独立。',
'添加步骤':'可从左侧步骤库选择确定性或 AI 步骤。此原型支持选择和编辑现有步骤；完整新增、排序和发布流程留在产品实现阶段。'
};
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;
if(el.dataset.themeChoice){state.theme=el.dataset.themeChoice;render();document.querySelector(`[data-theme-choice="${state.theme}"]`).focus({preventScroll:true});}
else if(el.dataset.page){if(['overview','studio','run'].includes(el.dataset.page)){state.page=el.dataset.page;render();document.querySelector('h1').setAttribute('tabindex','-1');document.querySelector('h1').focus({preventScroll:true});}else{const title=el.dataset.page==='targets'?'目标系统':'巡检调度';demo(title,descriptions[title]);}}
else if(el.dataset.step!==undefined){state.selected=Number(el.dataset.step);render();document.querySelector(`[data-step="${state.selected}"]`).focus({preventScroll:true});}
else if(el.hasAttribute('data-save-step')){steps[state.selected].intent=document.querySelector('#step-intent').value;steps[state.selected].name=document.querySelector('#output-name').value;steps[state.selected].model=document.querySelector('#model-route')?.value;demo('配置已应用到原型','当前步骤的内容已保留在本次浏览中。刷新后恢复示例数据；没有修改正式场景。');}
else if(el.dataset.evidence){state.evidence=el.dataset.evidence;render();document.querySelector(`[data-evidence="${state.evidence}"]`).focus({preventScroll:true});}
else if(el.dataset.run){if(el.dataset.run==='R-0926'){state.page='run';render();}else{demo('运行 '+el.dataset.run,'本轮完整展开了 R-0926 的失败排查路径。可点击「采购订单状态校验」查看步骤、两次尝试与证据。');}}
else if(el.dataset.runStep!==undefined){if(el.dataset.runStep==='3'){state.evidence='screenshot';render();}else{const i=Number(el.dataset.runStep);demo(`步骤 ${i+1} · ${steps[i].title}`,i<3?'该步骤成功。本轮详细原型聚焦步骤 04 的失败证据；正式产品将对每一步提供输入、输出、尝试和截图。':'此前断言失败，步骤 05 未执行，因此没有执行尝试与证据。');}}
else if(el.dataset.addType){demo('添加 '+el.dataset.addType,descriptions['添加步骤']);}
else if(el.dataset.demo){demo(el.dataset.demo,descriptions[el.dataset.demo]||'此入口用于展示完整信息架构。本轮可体验工作台、场景编排、运行详情，以及三种浅色主题；其余业务功能尚未接入。');}
});
const params=new URLSearchParams(location.search);if(Object.hasOwn(themes,params.get('theme')))state.theme=params.get('theme');if(['overview','studio','run'].includes(params.get('page')))state.page=params.get('page');render();
</script>
</body></html>
